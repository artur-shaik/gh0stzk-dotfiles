;; ash: модули, портированные из старого polybar shapes,
;; в пилюльном стиле cristina: колпачок aXi + модуль + колпачок aXd.
;; Цвета только через ${color.X} — wal-recolor их не трогает.

;; ---- колпачки-пилюли (по паре на цвет) ----

[module/api]
type = custom/text
label = "%{T4}%{T-}"
label-foreground = ${color.purple}
label-background = ${color.bg}

[module/apd]
type = custom/text
label = "%{T4}%{T-}"
label-foreground = ${color.purple}
label-background = ${color.bg}

