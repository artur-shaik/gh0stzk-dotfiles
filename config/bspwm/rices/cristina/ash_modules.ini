;; ---- модули ----

[module/mpd2]
type = custom/script
interval = 3
exec = pill-wrap.sh red "" '' mpd-polybar.sh
click-left = mpc toggle
format = <label>

[module/tasks]
type = custom/script
interval = 10
exec = pill-wrap.sh yellow "󰄲 " '^0[|]0$' tstats.sh
click-left = task-list-popup.sh &
format = <label>

[module/gmail]
type = custom/script
exec = ~/.config/polybar/scripts/polybar-gmail/launch.py | pill-pipe.sh green ""
tail = true
click-left = xdg-open https://mail.google.com
format = <label>

[module/keyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
format = <label-layout><label-indicator>
format-prefix = " 󰌌 "
format-background = ${color.yellow}
format-foreground = ${color.bg}
label-layout = "%layout% "
label-indicator-on = " %name%"

[module/ping]
type = custom/script
interval = 4
exec = ~/.config/polybar/scripts/ping.sh
format-prefix = " 󰓅 "
format = "<label> "
format-background = ${color.purple}
format-foreground = ${color.bg}

[module/loadavg]
type = custom/script
interval = 2
exec = awk '{print $1" "$2" "$3}' < /proc/loadavg
click-left = alacritty --class Btop -e btop &
format-prefix = " 󰊚 "
format = "<label> "
format-background = ${color.teal}
format-foreground = ${color.bg}

[module/timew]
type = custom/script
interval = 10
exec = timew-current.sh
format-prefix = " 󱎫 "
format = "<label> "
format-background = ${color.yellow}
format-foreground = ${color.bg}

[module/ahi]
type = custom/text
label = "%{T4}%{T-}"
label-foreground = ${color.fg}
label-background = ${color.bg}
hidden = true

[module/ahd]
type = custom/text
label = "%{T4}%{T-}"
label-foreground = ${color.bg}
label-background = ${color.fg}
hidden = true

[module/traytoggle]
type = custom/text
label = "󰅁"
label-foreground = ${color.fg}
click-left = tray-toggle.sh

[module/docker]
type = custom/script
interval = 10
exec = pill-wrap.sh amber "󰡨 " '^0$' docker-polybar.sh
click-left = alacritty --class LazyDocker -e lazydocker &
format = <label>

;; ash: свои варианты updates/bluetooth (его — ipc/иконка в modules.ini),
;; в пилюль-обёртке со скрытием при отсутствии данных
[module/updates2]
type = custom/script
interval = 60
exec = pill-wrap.sh red "󰚰 " '^0$' cat ~/.cache/Updates.txt
click-left = updates-popup.sh &
format = <label>

[module/bluetooth2]
type = custom/script
interval = 5
exec = pill-wrap.sh fg "󰂯 " '^$' ~/.config/polybar/scripts/bluetooth-device.sh
click-left = OpenApps --bluetooth
format = <label>
