;; ---- модули ----

[module/mpd2]
type = internal/mpd
host = 10.11.0.18
port = 6600
interval = 3
format-online = <toggle> <label-song>
format-online-background = ${color.purple}
format-online-foreground = ${color.bg}
label-song = %artist% - %title%
label-song-maxlen = 35
label-song-ellipsis = true
icon-play = ""
icon-pause = ""
label-song-padding = 1

[module/tasks]
type = custom/script
interval = 10
exec = tstats.sh
format-prefix = " "
format = "<label> "
format-background = ${color.green}
format-foreground = ${color.bg}

[module/gmail]
type = custom/script
exec = ~/.config/polybar/scripts/polybar-gmail/launch.py
tail = true
click-left = xdg-open https://mail.google.com
format = "<label> "
format-background = ${color.red}
format-foreground = ${color.bg}

[module/keyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
format = <label-layout><label-indicator>
format-prefix = " "
format-background = ${color.blue}
format-foreground = ${color.bg}
label-layout = "%layout% "
label-indicator-on = " %name%"

[module/ping]
type = custom/script
interval = 4
exec = ~/.config/polybar/scripts/ping.sh
format-prefix = " 󰓅 "
format = "<label> "
format-background = ${color.teal}
format-foreground = ${color.bg}

[module/loadavg]
type = custom/script
interval = 2
exec = awk '{print $1" "$2" "$3}' < /proc/loadavg
format-prefix = " 󰊚 "
format = "<label> "
format-background = ${color.amber}
format-foreground = ${color.bg}

[module/timew]
type = custom/script
interval = 10
exec = timew-current.sh
format-prefix = " 󱎫 "
format = "<label> "
format-background = ${color.yellow}
format-foreground = ${color.bg}
