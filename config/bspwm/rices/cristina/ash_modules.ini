;; ---- модули ----

[module/mpd2]
type = custom/script
interval = 3
exec = pill-wrap.sh grad5 "" '' mpd-polybar.sh
click-left = OpenApps --player &
click-right = mpc toggle
format = <label>

[module/tasks]
type = custom/script
interval = 10
exec = pill-wrap.sh grad5 "󰄲 " '^0[|]0$' tstats.sh
click-left = task-list-popup.sh &
format = <label>

[module/gmail]
type = custom/script
exec = ~/.config/polybar/scripts/polybar-gmail/launch.py | pill-pipe.sh grad4 ""
tail = true
click-left = xdg-open https://mail.google.com
format = <label>

[module/keyboard]
type = custom/script
exec = keyboard-polybar.sh
tail = true
format = <label>
[module/ping]
type = custom/script
interval = 4
exec = ~/.config/polybar/scripts/ping.sh
format-prefix = " 󰓅 "
format = "<label> "
format-background = ${color.grad3}
format-foreground = ${color.bg}

;; ash: self-drawing пилюля (условный цвет: load1>6 -> алый). Колпачки/фон/клик
;; рисует сам скрипт -> внешних g4-колпачков и sep в modules-right у неё НЕТ.
[module/loadavg]
type = custom/script
interval = 2
exec = loadavg-polybar.sh
format = <label>

[module/timew]
type = custom/script
interval = 10
exec = timew-current.sh
format-prefix = " 󱎫 "
format = "<label> "
format-background = ${color.blue}
format-foreground = ${color.bg}

[module/ahi]
type = custom/text
label = "%{T4}%{T-}"
label-foreground = ${color.blue}
label-background = ${color.bg}
hidden = true

[module/ahd]
type = custom/text
label = "%{T4}%{T-}"
label-foreground = ${color.bg}
label-background = ${color.blue}
hidden = true

[module/traytoggle]
type = custom/text
label = "󰅁"
label-foreground = ${color.fg}
click-left = tray-toggle.sh

;; ash: workrave-индикатор — countdown до rest break, отсчёт перерыва,
;; suspended=zzz; ЛКМ — форс перерыва, СКМ — окно workrave, ПКМ — пауза слежения
[module/workrave]
type = custom/script
exec = workrave-polybar.sh
tail = true
click-left = workrave-polybar.sh break
click-middle = workrave-polybar.sh open
click-right = workrave-polybar.sh toggle
format = <label>

[module/docker]
type = custom/script
interval = 10
exec = pill-wrap.sh grad4 "󰡨 " '^0$' docker-polybar.sh
click-left = alacritty --class LazyDocker -e lazydocker &
format = <label>

;; ash: свои варианты updates/bluetooth (его — ipc/иконка в modules.ini),
;; в пилюль-обёртке со скрытием при отсутствии данных
[module/updates2]
type = custom/script
interval = 60
exec = pill-wrap.sh grad3 "󰚰 " '^0$' cat ~/.cache/Updates.txt
click-left = updates-popup.sh &
format = <label>

[module/bluetooth2]
type = custom/script
interval = 5
exec = pill-wrap.sh grad2 "" '' bluetooth-pill.sh
click-left = OpenApps --bluetooth
format = <label>

;; ash: security-scan индикаторы — алерт (флаг угрозы) + статус скана
[module/secscanalert]
type = custom/script
interval = 5
exec = pill-wrap.sh "#d54e53" "󰀦 " '' secscan-polybar.sh alert
click-left = alacritty -e sh -c 'sudo tail -n 80 /var/log/security-scan/scan-$(date +%F).log 2>/dev/null; echo; echo "[Enter] закрыть"; read' &
click-right = alacritty --class secack -e sudo secscan-ack &
format = <label>

[module/secscanscan]
type = custom/script
interval = 5
exec = pill-wrap.sh grad4 "󰐷 " '' secscan-polybar.sh scan
click-left = alacritty --class SecScanLive -e secscan-live.sh &
format = <label>
