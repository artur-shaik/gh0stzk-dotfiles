;; ash: модули, портированные из старого polybar shapes
;; цвета только через ${color.X} — wal-recolor их не трогает,
;; палитра приходит из [color] секции config.ini

[module/gmail]
type = custom/script
exec = ~/.config/polybar/scripts/polybar-gmail/launch.py
tail = true
click-left = xdg-open https://mail.google.com
format-foreground = ${color.fg}

[module/ping]
type = custom/script
interval = 4
format-prefix = " "
format = "<label> "
format-foreground = ${color.blue}
exec = ~/.config/polybar/scripts/ping.sh

[module/tasks]
type = custom/script
interval = 10
format-prefix = "  "
format = "<label> "
format-foreground = ${color.green}
exec = tstats.sh

[module/timew]
type = custom/script
interval = 10
format-prefix = " 神壟 "
format = " <label> "
format-foreground = ${color.yellow}
exec = timew-current.sh

[module/loadavg]
type = custom/script
interval = 1
format-prefix = " "
format = " <label> "
format-foreground = ${color.purple}
exec = awk '{print $1" "$2" "$3}' < /proc/loadavg

[module/keyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
format = <label-layout> <label-indicator>
format-prefix = " "
format-foreground = ${color.fg}

[module/mpd2]
type = internal/mpd
host = 10.11.0.18
port = 6600
interval = 3
format-online = <toggle> <label-song>
label-song = %artist% - %title%
label-song-maxlen = 40
label-song-ellipsis = true
icon-play =
icon-pause =
format-online-foreground = ${color.fg}
