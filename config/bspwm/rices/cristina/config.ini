[global/wm]

margin-bottom = 0
margin-top = 0

include-file = ../../config/system.ini
include-file = modules.ini
include-file = ash_modules.ini

[color]
redb = #758d8f
blackb = #4c5557
bg = #111d1f
bg-alt = #00111d1f
fg = #c3c6c7

trans = #00111d1f
white = #c3c6c7
black = #111d1f

red = #758d8f
pink = #758d8f
purple = #99acb0
blue = #a6a291
cyan = #b0bebe
teal = #a6a291
green = #958e7b
lime = #4c5557
yellow = #849da2
amber = #849da2
orange = #758d8f
brown = #4c5557
grey = #111d1f
indigo = #4c5557
blue-gray = #4c5557

[bar/cristina-bar]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = true
fixed-center = false

width = 95%
height = 20

offset-x = 2.5%
offset-y = 5

background = ${color.bg}
foreground = ${color.fg}

radius-bottom = 1

line-size = 3
line-color = ${color.blue}

border-size = 14
border-color = ${color.bg}

padding-left = 2
padding-right = 1

module-margin-left = 0
module-margin-right = 0

font-0 = "JetBrainsMono:style=Bold:pixelsize=9;2"
font-1 = "Material Design Icons Desktop:size=13;3"
font-2 = "Font Awesome 6 Free Solid:size=10;3"
font-3 = "MesloLGS NF:style=Regular:size=13;3"

;Modules availables but not active:
;	brightness		weather		xkeyboard
modules-left = launcher sep2 bspwm sep2 title
modules-center =
modules-right = ari mpd2 ard tasks gmail sep ati loadavg atd docker sep abi network abd sep api ping apd updates2 sep ayi keyboard ayd sep agi pulseaudio agd sep ati battery atd bluetooth2 sep azi usercard mplayer azd sep abi date abd sep ahi tray ahd traytoggle sep power

separator =
dim-value = 1.0
;locale = es_MX.UTF-8

wm-restack = bspwm
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false
