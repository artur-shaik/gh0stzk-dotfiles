[global/wm]

margin-bottom = 0
margin-top = 0

include-file = ../../config/system.ini
include-file = modules.ini
include-file = ash_modules.ini

[color]
bg = #f9f9fa
bg-alt = #00f9f9fa
fg = #3e3e3e

trans = #00f9f9fa
white = #3e3e3e
black = #f9f9fa

red = #65696e
pink = #65696e
purple = #afb2b7
blue = #db959a
cyan = #b3b7ba
teal = #db959a
green = #696e73
lime = #bababb
yellow = #989ba0
amber = #989ba0
orange = #65696e
brown = #bababb
grey = #f9f9fa
indigo = #bababb
blue-gray = #bababb

[bar/cristina-bar]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = true
fixed-center = false

width = 95%
height = 20

offset-x = 2.5%
offset-y = 5

background = ${color.bg}
foreground = ${color.fg}

radius-bottom = 1

line-size = 3
line-color = ${color.blue}

border-size = 14
border-color = ${color.bg}

padding-left = 2
padding-right = 1

module-margin-left = 0
module-margin-right = 0

font-0 = "JetBrainsMono:style=Bold:pixelsize=9;2"
font-1 = "Material Design Icons Desktop:size=13;3"
font-2 = "Font Awesome 6 Free Solid:size=10;3"
font-3 = "MesloLGS NF:style=Regular:size=13;3"

;Modules availables but not active:
;	brightness		weather		xkeyboard
modules-left = launcher sep2 bspwm sep2 title sep2 ayi timew ayd
modules-center =
modules-right = api mpd2 apd sep agi tasks agd sep ari gmail ard sep abi keyboard abd sep aai loadavg aad sep azi bluetooth usercard mplayer azd sep ali battery ald sep bgi updates bgd bbi pulseaudio bbd boi network bod ati ping atd bii date bid sep tray sep power

separator =
dim-value = 1.0
;locale = es_MX.UTF-8

wm-restack = bspwm
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false
