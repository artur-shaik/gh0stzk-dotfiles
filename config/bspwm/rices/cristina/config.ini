[global/wm]

margin-bottom = 0
margin-top = 0

include-file = ../../config/system.ini
include-file = modules.ini
include-file = ash_modules.ini

[color]
redb = #3b4a69
blackb = #bababa
bg = #f8f8f8
bg-alt = #00f8f8f8
fg = #3e3e3e

trans = #00f8f8f8
white = #3e3e3e
black = #f8f8f8

red = #3b4a69
pink = #3b4a69
purple = #8399b0
blue = #737888
cyan = #9faeba
teal = #737888
green = #733f3f
lime = #bababa
yellow = #4c6384
amber = #4c6384
orange = #3b4a69
brown = #bababa
grey = #f8f8f8
indigo = #bababa
blue-gray = #bababa

[bar/cristina-bar]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = true
fixed-center = false

width = 100%:-40
height = 20

offset-x = 20
offset-y = 20

background = ${color.bg}
foreground = ${color.fg}

radius-bottom = 1

line-size = 3
line-color = ${color.blue}

border-size = 14
border-color = ${color.bg}

padding-left = 2
padding-right = 1

module-margin-left = 0
module-margin-right = 0

font-0 = "JetBrainsMono:style=Bold:pixelsize=9;2"
font-1 = "Material Design Icons Desktop:size=13;3"
font-2 = "Font Awesome 6 Free Solid:size=10;3"
font-3 = "MesloLGS NF:style=Regular:size=13;3"

;Modules availables but not active:
;	brightness		weather		xkeyboard
modules-left = launcher sep2 bspwm sep2 title
modules-center =
modules-right = mpd2 tasks gmail workrave sep ati loadavg atd docker sep abi network abd sep api ping apd updates2 sep ayi keyboard ayd sep agi pulseaudio agd sep ati battery atd bluetooth2 sep azi usercard azd sep abi date abd sep ahi tray ahd traytoggle sep power

separator =
dim-value = 1.0
;locale = es_MX.UTF-8

wm-restack = bspwm
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false
