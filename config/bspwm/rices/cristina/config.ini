[global/wm]

margin-bottom = 0
margin-top = 0

include-file = ../../config/system.ini
include-file = modules.ini
include-file = ash_modules.ini

[color]
grad5 = #d89f8d
grad4 = #bd7875
grad3 = #b0694f
grad2 = #8a4c42
grad1 = #6a3e2f
redb = #b8745d
blackb = #bbbab9
bg = #faf8f7
bg-alt = #00faf8f7
fg = #3e3e3d

trans = #00faf8f7
white = #3e3e3d
black = #faf8f7

red = #b8745d
pink = #b8745d
purple = #d69b88
blue = #b7a1a0
cyan = #c8b2b1
teal = #b7a1a0
green = #a88f8b
lime = #bbbab9
yellow = #c28b77
amber = #c28b77
orange = #b8745d
brown = #bbbab9
grey = #faf8f7
indigo = #bbbab9
blue-gray = #bbbab9

[bar/cristina-bar]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = true
fixed-center = false

width = 100%:-40
height = 20

offset-x = 20
offset-y = 20

background = ${color.bg}
foreground = ${color.fg}

radius-top = 0
radius-bottom = 6

line-size = 3
line-color = ${color.blue}

border-size = 14
border-color = ${color.bg}

padding-left = 2
padding-right = 1

module-margin-left = 0
module-margin-right = 0

font-0 = "JetBrainsMono Nerd Font:style=Bold:pixelsize=9;2"
font-1 = "Material Design Icons Desktop:size=13;3"
font-2 = "Font Awesome 6 Free Solid:size=10;3"
font-3 = "MesloLGS NF:style=Regular:size=13;3"

;Modules availables but not active:
;	brightness		weather		xkeyboard
modules-left = launcher sep2 bspwm sep2 title
modules-center =
modules-right = mpd2 tasks gmail workrave loadavg docker sep g3i network g3d sep g3i ping g3d updates2 keyboard sep g2i pulseaudio g2d sep g2i battery g2d bluetooth2 sep g2i usercard g2d sep g1i date g1d sep ahi tray ahd traytoggle sep power

separator =
dim-value = 1.0
;locale = es_MX.UTF-8

wm-restack = bspwm
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false
