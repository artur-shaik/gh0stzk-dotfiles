[global/wm]

margin-bottom = 0
margin-top = 0

include-file = ../../config/system.ini
include-file = modules.ini
include-file = ash_modules.ini

[color]
grad5 = #cd98a5
grad4 = #ed9345
grad3 = #ac9c53
grad2 = #90763c
grad1 = #616732
redb = #989991
blackb = #60514c
bg = #2b1711
bg-alt = #002b1711
fg = #cac5c3

trans = #002b1711
white = #cac5c3
black = #2b1711

red = #989991
pink = #989991
purple = #bfbbbc
blue = #ef9e57
cyan = #dfce80
teal = #ef9e57
green = #c4aa71
lime = #60514c
yellow = #b2ad97
amber = #b2ad97
orange = #989991
brown = #60514c
grey = #2b1711
indigo = #60514c
blue-gray = #60514c

[bar/cristina-bar]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = true
fixed-center = false

width = 100%:-40
height = 20

offset-x = 20
offset-y = 20

background = ${color.bg}
foreground = ${color.fg}

radius-bottom = 1

line-size = 3
line-color = ${color.blue}

border-size = 14
border-color = ${color.bg}

padding-left = 2
padding-right = 1

module-margin-left = 0
module-margin-right = 0

font-0 = "JetBrainsMono:style=Bold:pixelsize=9;2"
font-1 = "Material Design Icons Desktop:size=13;3"
font-2 = "Font Awesome 6 Free Solid:size=10;3"
font-3 = "MesloLGS NF:style=Regular:size=13;3"

;Modules availables but not active:
;	brightness		weather		xkeyboard
modules-left = launcher sep2 bspwm sep2 title
modules-center =
modules-right = mpd2 sep tasks sep gmail workrave sep g4i loadavg g4d docker sep g3i network g3d sep g3i ping g3d updates2 sep keyboard sep g2i pulseaudio g2d sep g2i battery g2d bluetooth2 sep g2i usercard g2d sep g1i date g1d sep ahi tray ahd traytoggle sep power

separator =
dim-value = 1.0
;locale = es_MX.UTF-8

wm-restack = bspwm
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false
