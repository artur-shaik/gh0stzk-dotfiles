[global/wm]

margin-bottom = 0
margin-top = 0

include-file = ../../config/system.ini
include-file = modules.ini
include-file = ash_modules.ini

[color]
redb = #364b4e
blackb = #424343
bg = #040505
bg-alt = #00040505
fg = #c0c0c0

trans = #00040505
white = #c0c0c0
black = #040505

red = #364b4e
pink = #364b4e
purple = #508da2
blue = #4b717a
cyan = #6fadc1
teal = #4b717a
green = #2d5768
lime = #424343
yellow = #6d492f
amber = #6d492f
orange = #364b4e
brown = #424343
grey = #040505
indigo = #424343
blue-gray = #424343

[bar/cristina-bar]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = true
fixed-center = false

width = 95%
height = 20

offset-x = 2.5%
offset-y = 5

background = ${color.bg}
foreground = ${color.fg}

radius-bottom = 1

line-size = 3
line-color = ${color.blue}

border-size = 14
border-color = ${color.bg}

padding-left = 2
padding-right = 1

module-margin-left = 0
module-margin-right = 0

font-0 = "JetBrainsMono:style=Bold:pixelsize=9;2"
font-1 = "Material Design Icons Desktop:size=13;3"
font-2 = "Font Awesome 6 Free Solid:size=10;3"
font-3 = "MesloLGS NF:style=Regular:size=13;3"

;Modules availables but not active:
;	brightness		weather		xkeyboard
modules-left = launcher sep2 bspwm sep2 title
modules-center =
modules-right = ari mpd2 ard sep ayi tasks ayd sep agi gmail agd sep ati keyboard atd sep abi loadavg abd sep api updates apd ari pulseaudio ard ayi network ayd agi ping agd ati battery atd sep azi bluetooth usercard mplayer azd sep abi date abd sep tray sep power

separator =
dim-value = 1.0
;locale = es_MX.UTF-8

wm-restack = bspwm
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false
