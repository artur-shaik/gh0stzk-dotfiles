[global/wm]

margin-bottom = 0
margin-top = 0

include-file = ../../config/system.ini
include-file = modules.ini
include-file = ash_modules.ini

[color]
redb = #614F26
blackb = #424140
bg = #030201
bg-alt = #00030201
fg = #c0bfbf

trans = #00030201
white = #c0bfbf
black = #030201

red = #614F26
pink = #614F26
purple = #AA9465
blue = #8B703B
cyan = #8F7994
teal = #8B703B
green = #3E3E42
lime = #424140
yellow = #5C5B58
amber = #5C5B58
orange = #614F26
brown = #424140
grey = #030201
indigo = #424140
blue-gray = #424140

[bar/cristina-bar]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = true
fixed-center = false

width = 100%:-40
height = 20

offset-x = 20
offset-y = 20

background = ${color.bg}
foreground = ${color.fg}

radius-bottom = 1

line-size = 3
line-color = ${color.blue}

border-size = 14
border-color = ${color.bg}

padding-left = 2
padding-right = 1

module-margin-left = 0
module-margin-right = 0

font-0 = "JetBrainsMono:style=Bold:pixelsize=9;2"
font-1 = "Material Design Icons Desktop:size=13;3"
font-2 = "Font Awesome 6 Free Solid:size=10;3"
font-3 = "MesloLGS NF:style=Regular:size=13;3"

;Modules availables but not active:
;	brightness		weather		xkeyboard
modules-left = launcher sep2 bspwm sep2 title
modules-center =
modules-right = mpd2 tasks gmail sep ati loadavg atd docker sep abi network abd sep api ping apd updates2 sep ayi keyboard ayd sep agi pulseaudio agd sep ati battery atd bluetooth2 sep azi usercard azd sep abi date abd sep ahi tray ahd traytoggle sep power

separator =
dim-value = 1.0
;locale = es_MX.UTF-8

wm-restack = bspwm
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false
