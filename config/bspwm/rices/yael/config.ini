[global/wm]

margin-bottom = 0
margin-top = 0

include-file = ../../config/system.ini
include-file = modules.ini

[color]
bg = #f8f9f9
fg = #3e3e3e

red = #37467d
pink = #37467d
purple = #d68d7e
blue = #878393
blue-arch = #878393
cyan = #e99257
teal = #487e4d
green = #487e4d
lime = #7b8957
yellow = #7b8957
amber = #7b8957
orange = #37467d
brown = #37467d
grey = #487e4d
indigo = #e99257
blue-gray = #487e4d

[bar/yael-cohen]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = false

bottom = false
fixed-center = false

width = 98%
height = 32

offset-x = 1%
offset-y = 5

background = ${color.bg}
foreground = ${color.fg}

radius = 5

line-size = 2
line-color = ${color.blue}

border = 0
border-color = ${color.bg}

padding = 0

module-margin-left = 0
module-margin-right = 0

; Text
font-0 = "JetBrainsMono:style=ExtraBold:size=9;3"
; Icons
font-1 = "Font Awesome 6 Free Solid:size=11;3"
font-2 = "Material Design Icons Desktop:size=14;3"
font-3 = "Font Awesome 6 Free Solid:size=9;3"
;dpi = 96

;Modules availables but not active:
;	brightness		weather		xkeyboard
modules-left = launcher sep sep bspwm
modules-center = title
modules-right =  mpd sep sep mpd_control sep sep pulseaudio sep bluetooth sep battery sep sep filesystem sep sep memory_bar sep sep cpu_bar sep sep network sep sep mplayer usercard sep sep updates sep sep power sep sep tray sep sep date

separator =
dim-value = 1.0

;;locale = es_MX.UTF-8

wm-restack = bspwm
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]

screenchange-reload = false

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false
